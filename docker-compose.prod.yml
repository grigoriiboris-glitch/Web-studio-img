services:
  backend:
    build: {context: ., dockerfile: Dockerfile.prod}
    env_file: [.env]
    ports: ["${HOST_APP_PORT}:8080"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    build: {context: ./backend, dockerfile: Dockerfile.worker}
    env_file: [.env]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
  postgres:
    image: postgres:16-alpine
    env_file: [.env]
    ports: ["${HOST_POSTGRES_PORT}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["${HOST_REDIS_PORT}:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: [redis_data:/data]
  minio:
    image: minio/minio:latest
    env_file: [.env]
    ports: ["${HOST_MINIO_API_PORT}:9000", "${HOST_MINIO_CONSOLE_PORT}:9001"]
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [minio_data:/data]
volumes:
  postgres_data:
  redis_data:
  minio_data:
