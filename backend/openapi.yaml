openapi: 3.0.3
info:
  title: Web Studio IMG API
  version: 1.0.0
  description: REST API for private Web Studio IMG projects and creative workflows.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getApiHealth
      summary: API health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: {type: string, example: ok}
                  service: {type: string, example: web-studio-img-api}
  /projects:
    get:
      operationId: listProjects
      summary: List projects owned by the authenticated user
      responses:
        '200':
          description: Project list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createProject
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /projects/{project_id}:
    parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getProject
      summary: Get an owned project
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateProject
      summary: Update an owned project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: archiveProject
      summary: Archive an owned project
      responses:
        '200':
          description: Archived project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/iterations:
    parameters:
      - name: project_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: listProjectIterations
      summary: List immutable creative iterations
      responses:
        '200':
          description: Iteration timeline
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IterationList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: createIteration
      summary: Create an immutable iteration
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IterationInput'}
      responses:
        '201':
          description: Iteration created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Iteration'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/iterations/{iteration_id}:
    parameters:
      - name: project_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: iteration_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getIteration
      summary: Get an immutable iteration
      responses:
        '200':
          description: Iteration
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Iteration'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/iterations/{iteration_id}/restore:
    post:
      operationId: restoreIteration
      summary: Restore an iteration by creating a new child iteration
      parameters:
        - name: project_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: iteration_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '201':
          description: Restored iteration
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Iteration'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
components:
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Iteration:
      type: object
      required: [id, project_id, type, created_at]
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        parent_iteration_id: {type: string, format: uuid}
        type: {type: string, enum: [idea, sketch, generation, selection, composition, prompt, manual_edit, final]}
        title: {type: string, maxLength: 200}
        description: {type: string, maxLength: 5000}
        created_at: {type: string, format: date-time}
    IterationInput:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        parent_iteration_id: {type: string, format: uuid}
        type: {type: string, enum: [idea, sketch, generation, selection, composition, prompt, manual_edit, final]}
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 5000}
    IterationList:
      type: object
      required: [iterations]
      properties:
        iterations:
          type: array
          items: {$ref: '#/components/schemas/Iteration'}
    Project:
      type: object
      required: [id, user_id, name, status, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string}
        status: {type: string, enum: [active, archived, deleted]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ProjectInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 2000}
    ProjectUpdate:
      type: object
      required: [name, status]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 2000}
        status: {type: string, enum: [active, archived, deleted]}
    ProjectList:
      type: object
      required: [projects]
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string}
