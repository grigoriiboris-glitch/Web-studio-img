  /projects/{project_id}/assistant/tools/{tool}:
    post:
      operationId: executeAssistantTool
      summary: Execute one allowlisted AI assistant tool; compare_iterations returns deterministic visual/composition scores and structured observations.
      parameters:
        - name: project_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: tool
          in: path
          required: true
          schema:
            type: string
            enum: [create_iteration, get_project_history, analyze_composition, search_references, check_similarity, suggest_prompt, suggest_materials, create_generation, compare_iterations, verify_provenance, fact_check]
        - name: Idempotency-Key
          in: header
          required: false
          description: Required for mutating assistant tools such as create_iteration and create_generation. fact_check is read-only and stores its structured result in the assistant action log.
          schema: {type: string, maxLength: 200}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              oneOf:
                - {$ref: '#/components/schemas/AssistantToolInput'}
                - {$ref: '#/components/schemas/CompareIterationsInput'}
                - {$ref: '#/components/schemas/FactCheckInput'}
            examples:
              compareIterations:
                summary: Compare two immutable iterations
                value:
                  iteration_a_id: 00000000-0000-0000-0000-000000000001
                  iteration_b_id: 00000000-0000-0000-0000-000000000002
      responses:
        '200':
          description: Tool result plus logged AI action
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AssistantToolResponse'}
                factCheckResult:
                  summary: Structured fact check
                  value:
                    explanation: Fact check classifies only user-supplied evidence assessments; it does not invent evidence or fetch external sources.
                    confidence: 0.85
                    uncertainty: Confidence is the average of supplied evidence confidence values; source contents are not independently verified.
                    result:
                      claim: A claim with supporting evidence
                      status: SUPPORTED
                      confidence: 0.85
                      supporting_count: 2
                      contradicting_count: 0
                      unknown_count: 0
                      method: evidence-adjudicator-v1
                      source_verification: not_performed
                      evidence:
                        - text: Primary source supports the claim.
                          source: https://example.test/primary
                          assessment: supports
                          confidence: 0.90

              examples:
                compareIterationsResult:
                  summary: Deterministic critic comparison
                  value:
                    explanation: Critic comparison combines persisted iteration metadata, prompt text, and deterministic visual/composition descriptors.
                    confidence: 0.84
                    uncertainty: This is a heuristic critic; semantic similarity is only a proxy from deterministic image descriptors.
                    result:
                      compared_at: "2026-09-27T12:00:00Z"
                      prompts:
                        similarity: 0.72
                      image_comparison:
                        visual_similarity: 0.81
                        composition_similarity: 0.69
                        semantic_similarity_proxy: 0.64
                        style_similarity: 0.77
                        algorithm: deterministic-image-descriptors
                        algorithm_version: 1.0.0
                      observations:
                        - dimension: visual
                          observation: Visual similarity is high between the iterations.
