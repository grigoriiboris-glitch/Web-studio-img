openapi: 3.0.3
info:
  title: Web Studio IMG API
  version: 1.0.0
  description: REST API for private Web Studio IMG projects and creative workflows.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getApiHealth
      summary: API health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: {type: string, example: ok}
                  service: {type: string, example: web-studio-img-api}

  /library/assets:
    get:
      operationId: listAssetLibrary
      summary: List global asset library items
      parameters:
        - {name: q, in: query, schema: {type: string}}
        - {name: type, in: query, schema: {type: string, enum: [character, object, product, logo, symbol, background, texture, material, mask, image, other]}}
        - {name: tag, in: query, schema: {type: string}}
        - {name: status, in: query, schema: {type: string, enum: [active, archived]}}
      responses:
        '200':
          description: Library items
          content: {application/json: {schema: {$ref: '#/components/schemas/AssetLibraryList'}}}
    post:
      operationId: createAssetLibraryItem
      summary: Add an immutable project asset to the global library
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AssetLibraryItemInput'}}}
      responses:
        '201': {description: Library item created, content: {application/json: {schema: {$ref: '#/components/schemas/AssetLibraryItem'}}}}
  /library/assets/{item_id}:
    parameters:
      - {name: item_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: getAssetLibraryItem
      summary: Get current version, history and project usage
      responses:
        '200': {description: Library item detail, content: {application/json: {schema: {$ref: '#/components/schemas/AssetLibraryDetail'}}}}
    patch:
      operationId: updateAssetLibraryItem
      summary: Update library metadata without changing immutable versions
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AssetLibraryItemUpdate'}}}
      responses:
        '200': {description: Updated item, content: {application/json: {schema: {$ref: '#/components/schemas/AssetLibraryItem'}}}}
    delete:
      operationId: archiveAssetLibraryItem
      summary: Archive a library item
      responses:
        '204': {description: Archived}
  /library/assets/{item_id}/versions:
    parameters:
      - {name: item_id, in: path, required: true, schema: {type: string, format: uuid}}
    get:
      operationId: listAssetLibraryVersions
      summary: List immutable versions
      responses:
        '200':
          description: Versions
          content:
            application/json:
              schema:
                type: object
                required: [versions]
                properties:
                  versions: {type: array, items: {$ref: '#/components/schemas/AssetLibraryVersion'}}
    post:
      operationId: createAssetLibraryVersion
      summary: Create a new immutable version from a project asset
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AssetLibraryVersionInput'}}}
      responses:
        '201': {description: Version created, content: {application/json: {schema: {$ref: '#/components/schemas/AssetLibraryVersion'}}}}
  /library/assets/{item_id}/usage:
    get:
      operationId: listAssetLibraryUsage
      summary: List project usages
      parameters:
        - {name: item_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Usage
          content: {application/json: {schema: {type: object, required: [usage], properties: {usage: {type: array, items: {$ref: '#/components/schemas/AssetLibraryUsage'}}}}}}
  /library/assets/{item_id}/use:
    post:
      operationId: useAssetLibraryItemInProject
      summary: Record usage of a library version in a project
      parameters:
        - {name: item_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content: {application/json: {schema: {$ref: '#/components/schemas/AssetLibraryUseInput'}}}
      responses:
        '200':
          description: Usage
          content:
            application/json:
              schema:
                type: object
                required: [usage, version]
                properties:
                  usage: {$ref: '#/components/schemas/AssetLibraryUsage'}
                  version: {$ref: '#/components/schemas/AssetLibraryVersion'}
  /library/sources:
    get:
      operationId: listAssetLibrarySources
      summary: List active project assets available for library import
      parameters:
        - {name: project_id, in: query, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Source assets
          content:
            application/json:
              schema:
                type: object
                required: [sources]
                properties:
                  sources: {type: array, items: {$ref: '#/components/schemas/AssetLibrarySource'}}

  /projects:
    get:
      operationId: listProjects
      summary: List projects owned by the authenticated user
      responses:
        '200':
          description: Project list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createProject
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /projects/{project_id}:
    parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getProject
      summary: Get an owned project
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateProject
      summary: Update an owned project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: archiveProject
      summary: Archive an owned project
      responses:
        '200':
          description: Archived project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/variant-sources:
    get:
      operationId: listVariantSources
      summary: List completed generation sources available to Variant Board
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Variant sources
          content:
            application/json:
              schema:
                type: object
                required: [sources]
                properties:
                  sources:
                    type: array
                    items: {$ref: '#/components/schemas/VariantSource'}
  /projects/{project_id}/variant-sets:
    get:
      operationId: listVariantSets
      summary: List Variant Sets
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Variant Sets
          content:
            application/json:
              schema:
                type: object
                required: [variant_sets]
                properties:
                  variant_sets:
                    type: array
                    items: {$ref: '#/components/schemas/VariantSet'}
    post:
      operationId: createVariantSet
      summary: Create an immutable Variant Set from completed generations
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateVariantSetInput'}
      responses:
        '201':
          description: Variant Set created
          content:
            application/json:
              schema:
                type: object
                required: [variant_set, variants]
                properties:
                  variant_set: {$ref: '#/components/schemas/VariantSet'}
                  variants:
                    type: array
                    items: {$ref: '#/components/schemas/Variant'}
  /projects/{project_id}/variant-sets/{set_id}:
    get:
      operationId: getVariantSet
      summary: Get a Variant Set with variants
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: set_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Variant Set
          content:
            application/json:
              schema:
                type: object
                required: [variant_set, variants]
                properties:
                  variant_set: {$ref: '#/components/schemas/VariantSet'}
                  variants:
                    type: array
                    items: {$ref: '#/components/schemas/Variant'}
  /projects/{project_id}/variant-sets/{set_id}/compare:
    get:
      operationId: compareVariants
      summary: Load 2 to 4 variants for comparison
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: set_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: variant_id
          in: query
          required: true
          style: form
          explode: true
          schema:
            type: array
            minItems: 2
            maxItems: 4
            items: {type: string, format: uuid}
      responses:
        '200':
          description: Variants for comparison
          content:
            application/json:
              schema:
                type: object
                required: [variants]
                properties:
                  variants:
                    type: array
                    items: {$ref: '#/components/schemas/Variant'}
  /projects/{project_id}/variant-sets/{set_id}/variants/{variant_id}:
    patch:
      operationId: updateVariantDecision
      summary: Update variant decision, favorite or compare selection
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: set_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: variant_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VariantPatch'}
      responses:
        '200':
          description: Updated variant
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Variant'}
  /projects/{project_id}/variant-sets/{set_id}/iterations:
    post:
      operationId: createIterationFromVariants
      summary: Create a new immutable selection iteration from variants
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: set_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateVariantIterationInput'}
      responses:
        '201':
          description: Created selection iteration
          content:
            application/json:
              schema:
                type: object
                required: [iteration_id, title, description]
                properties:
                  iteration_id: {type: string, format: uuid}
                  title: {type: string}
                  description: {type: string}
  /projects/{project_id}/variant-rejection-summary:
    get:
      operationId: getVariantRejectionSummary
      summary: Get rejection reason analytics for a project
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Rejection summary
          content:
            application/json:
              schema:
                type: object
                required: [rejected_count, reasons]
                properties:
                  rejected_count: {type: integer, minimum: 0}
                  reasons:
                    type: array
                    items:
                      type: object
                      required: [reason, count, percent]
                      properties:
                        reason: {type: string}
                        count: {type: integer, minimum: 0}
                        percent: {type: number, format: double, minimum: 0}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/variant-rejection-timeline:
    get:
      operationId: getVariantRejectionTimeline
      summary: Get the rejection decision timeline
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Rejection timeline
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, version, action_type, created_at]
                      properties:
                        id: {type: string, format: uuid}
                        version: {type: integer, format: int64}
                        action_type: {type: string}
                        payload: {type: object, additionalProperties: true}
                        old_state: {type: object, additionalProperties: true}
                        new_state: {type: object, additionalProperties: true}
                        created_at: {type: string, format: date-time}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/branches:
    get:
      operationId: listBranches
      summary: List creative branches
      parameters: [{name: project_id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses:
        '200': {description: Branches, content: {application/json: {schema: {type: object, required: [branches], properties: {branches: {type: array, items: {$ref: '#/components/schemas/Branch'}}}}}}}
    post:
      operationId: createBranch
      summary: Create a creative branch
      parameters: [{name: project_id, in: path, required: true, schema: {type: string, format: uuid}}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BranchInput'}}}}
      responses: {'201': {description: Branch, content: {application/json: {schema: {$ref: '#/components/schemas/Branch'}}}}}
  /projects/{project_id}/branches/{branch_id}:
    patch:
      operationId: updateBranch
      summary: Rename or archive a branch
      parameters:
        - {name: project_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: branch_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BranchUpdate'}}}}
      responses: {'200': {description: Branch, content: {application/json: {schema: {$ref: '#/components/schemas/Branch'}}}}}
  /projects/{project_id}/branches/compare:
    get:
      operationId: compareBranches
      summary: Compare persisted branch decisions
      parameters:
        - {name: project_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: source_branch_id, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: target_branch_id, in: query, required: true, schema: {type: string, format: uuid}}
      responses: {'200': {description: Branch differences, content: {application/json: {schema: {type: object, required: [differences], properties: {differences: {type: array, items: {$ref: '#/components/schemas/BranchDifference'}}}}}}}}
  /projects/{project_id}/branches/{branch_id}/merge:
    post:
      operationId: mergeBranchDecisions
      summary: Create an immutable target iteration from selected branch decisions
      parameters:
        - {name: project_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: branch_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/BranchMergeInput'}}}}
      responses:
        '201': {description: Merged iteration, content: {application/json: {schema: {$ref: '#/components/schemas/Iteration'}}}}
        '409': {description: Merge conflict}

  /projects/{project_id}/iterations:
    parameters:
      - name: project_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: listProjectIterations
      summary: List immutable creative iterations
      responses:
        '200':
          description: Iteration timeline
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IterationList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: createIteration
      summary: Create an immutable iteration
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IterationInput'}
      responses:
        '201':
          description: Iteration created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Iteration'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/iterations/{iteration_id}:
    parameters:
      - name: project_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: iteration_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getIteration
      summary: Get an immutable iteration
      responses:
        '200':
          description: Iteration
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Iteration'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/iterations/{iteration_id}/restore:
    post:
      operationId: restoreIteration
      summary: Restore an iteration by creating a new child iteration
      parameters:
        - name: project_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: iteration_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '201':
          description: Restored iteration
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Iteration'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  /projects/{project_id}/generations:
    parameters:
      - name: project_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: createGeneration
      summary: Queue an asynchronous image generation
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 200}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GenerationInput'}
      responses:
        '202':
          description: Generation queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Generation'}
        '200':
          description: Existing idempotent generation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Generation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
  /projects/{project_id}/generations/{generation_id}:
    parameters:
      - name: project_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: generation_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getGeneration
      summary: Get generation status and provenance parameters
      responses:
        '200':
          description: Generation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Generation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/generations/{generation_id}/cancel:
    post:
      operationId: cancelGeneration
      summary: Cancel a queued or running generation
      responses:
        '200':
          description: Cancelled generation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Generation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /projects/{project_id}/generations/{generation_id}/events:
    get:
      operationId: streamGenerationEvents
      summary: Stream generation status over SSE
      responses:
        '200':
          description: Server-sent generation status events
          content:
            text/event-stream:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  /projects/{project_id}/events:
    parameters:
      - name: project_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: streamProjectEvents
      summary: Stream project events over SSE
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: Project event stream
          content:
            text/event-stream:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  /projects/{project_id}/brief:
    get:
      summary: Get the latest creative brief
      operationId: getCreativeBrief
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Creative brief
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreativeBrief'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      summary: Create a new creative brief version
      operationId: createCreativeBrief
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreativeBriefInput'
      responses:
        '201':
          description: Creative brief
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreativeBrief'
  /projects/{project_id}/brief/versions:
    get:
      summary: List creative brief versions
      operationId: listCreativeBriefVersions
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Creative brief versions
          content:
            application/json:
              schema:
                type: object
                required: [briefs]
                properties:
                  briefs:
                    type: array
                    items:
                      $ref: '#/components/schemas/CreativeBrief'
  /projects/{project_id}/brief/approved:
    get:
      summary: Get the approved creative brief
      operationId: getApprovedCreativeBrief
      parameters:
        - $ref: '#/components/parameters/ProjectId'
      responses:
        '200':
          description: Approved creative brief
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreativeBrief'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/brief/{brief_id}/approve:
    post:
      summary: Approve a creative brief version
      operationId: approveCreativeBrief
      parameters:
        - $ref: '#/components/parameters/ProjectId'
        - name: brief_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Approved creative brief
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreativeBrief'
  /projects/{project_id}/prompts:
    parameters:
      - name: project_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: listPrompts
      summary: List versioned prompts
      responses:
        '200':
          description: Prompt versions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PromptList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: createPrompt
      summary: Create a new prompt version
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PromptInput'}
      responses:
        '201':
          description: Prompt created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Prompt'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /projects/{project_id}/prompts/{prompt_id}/approve:
    post:
      operationId: approvePrompt
      summary: Create an approved prompt version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [final_text]
              additionalProperties: false
              properties:
                final_text: {type: string, minLength: 1, maxLength: 20000}
                components: {type: object, additionalProperties: {type: string}}
      responses:
        '201':
          description: Approved prompt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Prompt'}
        '400': {$ref: '#/components/responses/BadRequest'}
