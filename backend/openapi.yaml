openapi: 3.0.3
info:
  title: Web Studio IMG API
  version: 1.0.0
  description: REST API for private Web Studio IMG projects and creative workflows.
servers:
  - url: /api/v1
paths:
  /health:
    get:
      operationId: getApiHealth
      summary: API health check
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status, service]
                properties:
                  status: {type: string, example: ok}
                  service: {type: string, example: web-studio-img-api}
  /projects:
    get:
      operationId: listProjects
      summary: List projects owned by the authenticated user
      responses:
        '200':
          description: Project list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: createProject
      summary: Create a project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /projects/{project_id}:
    parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getProject
      summary: Get an owned project
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      operationId: updateProject
      summary: Update an owned project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectUpdate'
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      operationId: archiveProject
      summary: Archive an owned project
      responses:
        '200':
          description: Archived project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /projects/{project_id}/iterations:
    parameters:
      - name: project_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: listProjectIterations
      summary: List immutable creative iterations
      responses:
        '200':
          description: Iteration timeline
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IterationList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: createIteration
      summary: Create an immutable iteration
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IterationInput'}
      responses:
        '201':
          description: Iteration created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Iteration'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/iterations/{iteration_id}:
    parameters:
      - name: project_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: iteration_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getIteration
      summary: Get an immutable iteration
      responses:
        '200':
          description: Iteration
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Iteration'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/iterations/{iteration_id}/restore:
    post:
      operationId: restoreIteration
      summary: Restore an iteration by creating a new child iteration
      parameters:
        - name: project_id
          in: path
          required: true
          schema: {type: string, format: uuid}
        - name: iteration_id
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        '201':
          description: Restored iteration
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Iteration'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  /projects/{project_id}/generations:
    parameters:
      - name: project_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: createGeneration
      summary: Queue an asynchronous image generation
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 200}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/GenerationInput'}
      responses:
        '202':
          description: Generation queued
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Generation'}
        '200':
          description: Existing idempotent generation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Generation'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '409': {$ref: '#/components/responses/Conflict'}
  /projects/{project_id}/generations/{generation_id}:
    parameters:
      - name: project_id
        in: path
        required: true
        schema: {type: string, format: uuid}
      - name: generation_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: getGeneration
      summary: Get generation status and provenance parameters
      responses:
        '200':
          description: Generation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Generation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
  /projects/{project_id}/generations/{generation_id}/cancel:
    post:
      operationId: cancelGeneration
      summary: Cancel a queued or running generation
      responses:
        '200':
          description: Cancelled generation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Generation'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
  /projects/{project_id}/generations/{generation_id}/events:
    get:
      operationId: streamGenerationEvents
      summary: Stream generation status over SSE
      responses:
        '200':
          description: Server-sent generation status events
          content:
            text/event-stream:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  /projects/{project_id}/events:
    parameters:
      - name: project_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: streamProjectEvents
      summary: Stream project events over SSE
      parameters:
        - name: Last-Event-ID
          in: header
          required: false
          schema: {type: integer, format: int64}
      responses:
        '200':
          description: Project event stream
          content:
            text/event-stream:
              schema: {type: string}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  /projects/{project_id}/prompts:
    parameters:
      - name: project_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: listPrompts
      summary: List versioned prompts
      responses:
        '200':
          description: Prompt versions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PromptList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    post:
      operationId: createPrompt
      summary: Create a new prompt version
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PromptInput'}
      responses:
        '201':
          description: Prompt created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Prompt'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /projects/{project_id}/prompts/{prompt_id}/approve:
    post:
      operationId: approvePrompt
      summary: Create an approved prompt version
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [final_text]
              additionalProperties: false
              properties:
                final_text: {type: string, minLength: 1, maxLength: 20000}
                components: {type: object, additionalProperties: {type: string}}
      responses:
        '201':
          description: Approved prompt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Prompt'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  /projects/{project_id}/prompts/{prompt_id}:
    get:
      operationId: getPrompt
      summary: Get one prompt version
      responses:
        '200':
          description: Prompt
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Prompt'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  /projects/{project_id}/references:
    parameters:
      - name: project_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: listReferences
      summary: List project references
      responses:
        '200':
          description: References
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ReferenceList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createReference
      summary: Add a reference with source and license metadata
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReferenceInput'}
      responses:
        '201':
          description: Reference created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Reference'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /projects/{project_id}/references/{reference_id}:
    patch:
      operationId: updateReference
      summary: Update reference metadata
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ReferenceInput'}
      responses:
        '200':
          description: Reference
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Reference'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}
    delete:
      operationId: deleteReference
      summary: Delete a project reference
      responses:
        '204': {description: Reference deleted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

  /projects/{project_id}/human-actions:
    parameters:
      - name: project_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: listHumanActions
      summary: List recorded human contribution actions
      responses:
        '200':
          description: Human actions
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HumanActionList'}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createHumanAction
      summary: Record an explicit user action
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/HumanActionInput'}
      responses:
        '201':
          description: Human action
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HumanAction'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}

  /projects/{project_id}/provenance/verify:
    get:
      operationId: verifyProvenance
      summary: Verify the project provenance hash chain
      responses:
        '200':
          description: Provenance verification
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ProvenanceVerification'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '404': {$ref: '#/components/responses/NotFound'}

components:
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Iteration:
      type: object
      required: [id, project_id, type, created_at]
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        parent_iteration_id: {type: string, format: uuid}
        type: {type: string, enum: [idea, sketch, generation, selection, composition, prompt, manual_edit, final]}
        title: {type: string, maxLength: 200}
        description: {type: string, maxLength: 5000}
        created_at: {type: string, format: date-time}
    IterationInput:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        parent_iteration_id: {type: string, format: uuid}
        type: {type: string, enum: [idea, sketch, generation, selection, composition, prompt, manual_edit, final]}
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 5000}
    IterationList:
      type: object
      required: [iterations]
      properties:
        iterations:
          type: array
          items: {$ref: '#/components/schemas/Iteration'}
    Project:
      type: object
      required: [id, user_id, name, status, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string}
        status: {type: string, enum: [active, archived, deleted]}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ProjectInput:
      type: object
      required: [name]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 2000}
    ProjectUpdate:
      type: object
      required: [name, status]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 2000}
        status: {type: string, enum: [active, archived, deleted]}
    ProjectList:
      type: object
      required: [projects]
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/Project'

    Generation:
      type: object
      required: [id, project_id, user_id, provider, model, prompt, status, created_at]
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        iteration_id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        provider: {type: string}
        model: {type: string}
        model_version: {type: string}
        prompt: {type: string}
        negative_prompt: {type: string}
        seed: {type: integer, format: int64}
        aspect_ratio: {type: string}
        parameters: {type: object, additionalProperties: true}
        status: {type: string, enum: [queued, running, succeeded, failed, cancelled]}
        provider_job_id: {type: string}
        error_code: {type: string}
        error_message: {type: string}
        cost: {type: number, format: double}
        created_at: {type: string, format: date-time}
        started_at: {type: string, format: date-time}
        completed_at: {type: string, format: date-time}
    GenerationInput:
      type: object
      additionalProperties: false
      required: [prompt]
      properties:
        iteration_id: {type: string, format: uuid}
        prompt: {type: string, minLength: 1, maxLength: 20000}
        negative_prompt: {type: string, maxLength: 10000}
        seed: {type: integer, format: int64}
        aspect_ratio: {type: string, pattern: '^[0-9]+:[0-9]+$'}
        parameters: {type: object, additionalProperties: true}

    Prompt:
      type: object
      required: [id, project_id, version, original_text, created_by, created_at]
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        iteration_id: {type: string, format: uuid}
        parent_prompt_id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        original_text: {type: string}
        ai_suggestions:
          type: array
          items: {type: string}
        final_text: {type: string}
        components:
          type: object
          additionalProperties: {type: string, maxLength: 4000}
          properties:
            subject: {type: string}
            composition: {type: string}
            camera: {type: string}
            lighting: {type: string}
            material: {type: string}
            texture: {type: string}
            color: {type: string}
            atmosphere: {type: string}
            style: {type: string}
            depth: {type: string}
            detail: {type: string}
            constraints: {type: string}
            negative_constraints: {type: string}
        created_by: {type: string, enum: [human, ai, mixed]}
        created_at: {type: string, format: date-time}
    PromptInput:
      type: object
      additionalProperties: false
      required: [original_text]
      properties:
        iteration_id: {type: string, format: uuid}
        parent_prompt_id: {type: string, format: uuid}
        original_text: {type: string, minLength: 1, maxLength: 20000}
        ai_suggestions:
          type: array
          maxItems: 20
          items: {type: string, maxLength: 4000}
        final_text: {type: string, maxLength: 20000}
        components:
          type: object
          additionalProperties: {type: string, maxLength: 4000}
        created_by: {type: string, enum: [human, ai, mixed]}
    PromptList:
      type: object
      required: [prompts]
      properties:
        prompts:
          type: array
          items: {$ref: '#/components/schemas/Prompt'}
    Reference:
      type: object
      required: [id, project_id, source_type, license, license_verified, user_owned, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        asset_id: {type: string, format: uuid}
        source_url: {type: string, format: uri}
        source_type: {type: string, enum: [inspiration, reference, direct_source, user_created, public_domain, unknown]}
        license: {type: string}
        license_verified: {type: boolean}
        user_owned: {type: boolean}
        sha256: {type: string, pattern: '^[0-9a-f]{64}      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string}
}
        notes: {type: string}
        influence: {$ref: '#/components/schemas/ReferenceInfluence'}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ReferenceInfluence:
      type: object
      required: [composition, semantic, color, style, material, geometry]
      properties:
        composition: {type: number, minimum: 0, maximum: 1}
        semantic: {type: number, minimum: 0, maximum: 1}
        color: {type: number, minimum: 0, maximum: 1}
        style: {type: number, minimum: 0, maximum: 1}
        material: {type: number, minimum: 0, maximum: 1}
        geometry: {type: number, minimum: 0, maximum: 1}
        warning: {type: string}
    ReferenceInput:
      type: object
      additionalProperties: false
      required: [source_type, license]
      properties:
        asset_id: {type: string, format: uuid}
        source_url: {type: string, format: uri}
        source_type: {type: string, enum: [inspiration, reference, direct_source, user_created, public_domain, unknown]}
        license: {type: string, minLength: 1, maxLength: 500}
        license_verified: {type: boolean}
        user_owned: {type: boolean}
        sha256: {type: string, pattern: '^[0-9a-f]{64}      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string}
}
        notes: {type: string, maxLength: 10000}
    ReferenceList:
      type: object
      required: [references]
      properties:
        references:
          type: array
          items: {$ref: '#/components/schemas/Reference'}
    HumanAction:
      type: object
      required: [id, project_id, user_id, action_type, created_at]
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        iteration_id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        action_type: {type: string, enum: [IDEA_CREATED, PROMPT_EDITED, PROMPT_APPROVED, REFERENCE_ADDED, REFERENCE_SELECTED, VARIANT_SELECTED, VARIANT_REJECTED, AI_RECOMMENDATION_REJECTED, COMPOSITION_CHANGED, MATERIAL_SELECTED, TEXTURE_SELECTED, MANUAL_EDIT, APPROVED, EXPORT_CREATED]}
        payload: {type: object, additionalProperties: true}
        old_state: {type: object, additionalProperties: true}
        new_state: {type: object, additionalProperties: true}
        ai_influence: {type: object, additionalProperties: true}
        created_at: {type: string, format: date-time}
    HumanActionInput:
      type: object
      additionalProperties: false
      required: [action_type]
      properties:
        iteration_id: {type: string, format: uuid}
        action_type: {type: string}
        payload: {type: object, additionalProperties: true}
        old_state: {type: object, additionalProperties: true}
        new_state: {type: object, additionalProperties: true}
        ai_influence: {type: object, additionalProperties: true}
    HumanActionList:
      type: object
      required: [actions]
      properties:
        actions:
          type: array
          items: {$ref: '#/components/schemas/HumanAction'}
    ProvenanceVerification:
      type: object
      required: [verified, event_count]
      properties:
        verified: {type: boolean}
        event_count: {type: integer}
        first_invalid_event_id: {type: string, format: uuid}
        reason: {type: string}

    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, request_id]
          properties:
            code: {type: string}
            message: {type: string}
            request_id: {type: string}
