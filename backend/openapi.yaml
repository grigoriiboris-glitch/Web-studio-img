        project_id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        iteration_id: {type: string, format: uuid}
        asset_id: {type: string, format: uuid}
        parent_layer_id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 200}
        layer_type: {type: string, enum: [base, mask, image, manual_edit, adjustment, group]}
        order_index: {type: integer}
        visible: {type: boolean}
        opacity: {type: number, minimum: 0, maximum: 1}
        blend_mode: {type: string}
        source_kind: {type: string, enum: [human, ai, derived, imported]}
        metadata: {type: object, additionalProperties: true}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    LayerInput:
      type: object
      additionalProperties: false
      required: [name, layer_type]
      properties:
        iteration_id: {type: string, format: uuid}
        asset_id: {type: string, format: uuid}
        parent_layer_id: {type: string, format: uuid}
        name: {type: string, minLength: 1, maxLength: 200}
        layer_type: {type: string, enum: [base, mask, image, manual_edit, adjustment, group]}
        order_index: {type: integer}
        visible: {type: boolean}
        opacity: {type: number, minimum: 0, maximum: 1}
        blend_mode: {type: string}
        source_kind: {type: string, enum: [human, ai, derived, imported]}
        metadata: {type: object, additionalProperties: true}
    LayerList:
      type: object
      required: [layers]
      properties:
        layers:
          type: array
          items: {$ref: '#/components/schemas/Layer'}
    ManualEdit:
      type: object
      required: [id, project_id, user_id, source_asset_id, operation, parameters, status, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        iteration_id: {type: string, format: uuid}
        source_asset_id: {type: string, format: uuid}
        mask_asset_id: {type: string, format: uuid}
        result_asset_id: {type: string, format: uuid}
        operation: {type: string, enum: [paint, erase, mask, composite]}
        prompt: {type: string, maxLength: 20000}
        parameters: {type: object, additionalProperties: true}
        status: {type: string, enum: [draft, applied, rejected]}
        idempotency_key: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ManualEditInput:
      type: object
      additionalProperties: false
      required: [source_asset_id, operation]
      properties:
        iteration_id: {type: string, format: uuid}
        source_asset_id: {type: string, format: uuid}
        mask_asset_id: {type: string, format: uuid}
        result_asset_id: {type: string, format: uuid}
        operation: {type: string, enum: [paint, erase, mask, composite]}
        prompt: {type: string, maxLength: 20000}
        parameters: {type: object, additionalProperties: true}
    ManualEditList:
      type: object
      required: [edits]
      properties:
        edits:
          type: array
          items: {$ref: '#/components/schemas/ManualEdit'}

    AssistantTool:
      type: object
      required: [name, description, mutating, recommendation]
      properties:
        name: {type: string}
        description: {type: string}
        mutating: {type: boolean}
        recommendation: {type: boolean}
    AssistantToolList:
      type: object
      required: [tools]
      properties:
        tools:
          type: array
          items: {$ref: '#/components/schemas/AssistantTool'}
    AssistantToolInput:
      type: object
      additionalProperties: true
    FactCheckInput:
      type: object
      additionalProperties: false
      required: [claim, evidence]
      properties:
        claim:
          type: string
          minLength: 1
          maxLength: 20000
        evidence:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [text, source, assessment, confidence]
            properties:
              text: {type: string, minLength: 1, maxLength: 20000}
              source: {type: string, minLength: 1, maxLength: 2000}
              assessment: {type: string, enum: [supports, contradicts, unknown]}
              confidence: {type: number, minimum: 0, maximum: 1}
    CompareIterationsInput:
      type: object
      additionalProperties: false
      required: [iteration_a_id, iteration_b_id]
      properties:
        iteration_a_id: {type: string, format: uuid}
        iteration_b_id: {type: string, format: uuid}
    AssistantRecommendation:
      type: object
      required: [recommendation, reason, evidence, confidence, affected_entity, expected_effect]
      properties:
        recommendation: {type: string}
        reason: {type: string}
        evidence: {type: object, additionalProperties: true}
        confidence: {type: number, minimum: 0, maximum: 1}
        affected_entity: {type: object, additionalProperties: true}
        expected_effect: {type: string}

    AssistantAction:
      type: object
      required: [id, project_id, user_id, tool, kind, input, output, explanation, confidence, uncertainty, created_at]
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        tool:
          type: string
          enum: [create_iteration, get_project_history, analyze_composition, search_references, check_similarity, suggest_prompt, suggest_materials, create_generation, compare_iterations, verify_provenance, fact_check]
        kind: {type: string, enum: [tool_execution, recommendation]}
        input: {type: object, additionalProperties: true}
        output: {type: object, additionalProperties: true, description: Recommendation tools include a nested recommendation object matching AssistantRecommendation.}
        explanation: {type: string}
        confidence: {type: number, minimum: 0, maximum: 1}
        uncertainty: {type: string}
        decision: {type: string, enum: [apply, edit, ignore]}
        created_at: {type: string, format: date-time}
        decided_at: {type: string, format: date-time}
    AssistantActionList:
      type: object
      required: [actions]
      properties:
        actions:
          type: array
          items: {$ref: '#/components/schemas/AssistantAction'}
    AssistantToolResponse:
      type: object
      required: [action, result, explanation, confidence, uncertainty]
      properties:
        action: {$ref: '#/components/schemas/AssistantAction'}
        result: {type: object, additionalProperties: true, description: Tool-specific result. fact_check returns claim, evidence, sources, confidence, status, checked_at, method, and source_verification.}
        explanation: {type: string}
        confidence: {type: number, minimum: 0, maximum: 1}
        uncertainty: {type: string}
    AssistantDecisionInput:
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: {type: string, enum: [apply, edit, ignore]}
        final_text: {type: string, maxLength: 20000}
        components:
          type: object
          additionalProperties: {type: string, maxLength: 4000}

    RecipeParameter:
      type: object
      required: [name, type, required, path]
      additionalProperties: false
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        type: {type: string, enum: [string, number, integer, boolean, image, mask]}
        required: {type: boolean}
        path: {type: string, minLength: 1}
        default: {}
        description: {type: string, maxLength: 1000}
    RecipeVersion:
      type: object
      required: [id, recipe_id, version, workflow, input_mappings, exposed_parameters, default_parameters, workflow_hash, created_by, created_at]
      properties:
        id: {type: string, format: uuid}
        recipe_id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        workflow: {type: object, additionalProperties: true}
        input_mappings: {type: object, additionalProperties: {type: string}}
        exposed_parameters:
          type: array
          items: {$ref: '#/components/schemas/RecipeParameter'}
        default_parameters: {type: object, additionalProperties: true}
        workflow_hash: {type: string, minLength: 64, maxLength: 64}
        created_by: {type: string, format: uuid}
        created_at: {type: string, format: date-time}
    Recipe:
      type: object
      required: [id, user_id, name, provider, model, scope, tags, published, current_version, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        user_id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        name: {type: string}
        description: {type: string}
        provider: {type: string}
        model: {type: string}
        model_version: {type: string}
        scope: {type: string, enum: [project, global]}
        tags: {type: array, items: {type: string}}
        preview_asset_id: {type: string, format: uuid}
        published: {type: boolean}
        current_version: {type: integer, minimum: 1}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        version: {$ref: '#/components/schemas/RecipeVersion'}
    RecipeVersionInput:
      type: object
      additionalProperties: false
      required: [workflow, input_mappings, exposed_parameters, default_parameters]
      properties:
        workflow: {type: object, additionalProperties: true}
        input_mappings: {type: object, additionalProperties: {type: string}}
        exposed_parameters:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/RecipeParameter'}
        default_parameters: {type: object, additionalProperties: true}
    RecipeCreate:
      allOf:
        - $ref: '#/components/schemas/RecipeVersionInput'
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 5000}
        provider: {type: string, enum: [comfyui]}
        model: {type: string, minLength: 1, maxLength: 200}
        model_version: {type: string, maxLength: 200}
        scope: {type: string, enum: [project, global]}
        project_id: {type: string, format: uuid}
        tags: {type: array, maxItems: 30, items: {type: string, maxLength: 100}}
        preview_asset_id: {type: string, format: uuid}
    
    Iteration:
    ApprovalCheck:
      type: object
      required: [key, label, status, critical, message]
      properties:
        key: {type: string}
        label: {type: string}
        status: {type: string, enum: [passed, warning, blocked]}
        critical: {type: boolean}
        message: {type: string}
    ApprovalGate:
      type: object
      required: [workflow_state, checks, warnings, blocked, can_request_review, can_approve, can_finalize, override_required]
      properties:
        workflow_state: {type: string, enum: [draft, explore, develop, ready_for_review, approved, final]}
        final_iteration_id: {type: string, format: uuid}
        final_asset_id: {type: string, format: uuid}
        checks:
          type: array
          items: {$ref: '#/components/schemas/ApprovalCheck'}
        warnings: {type: array, items: {type: string}}
        blocked: {type: array, items: {type: string}}
        can_request_review: {type: boolean}
        can_approve: {type: boolean}
        can_finalize: {type: boolean}
        override_required: {type: boolean}
        approved_at: {type: string, format: date-time}
        finalized_at: {type: string, format: date-time}
    FinalizeInput:
      type: object
      additionalProperties: false
      properties:
        override_reason: {type: string, maxLength: 2000}
        override_checks:
          type: array
          uniqueItems: true
          items: {type: string}
      type: object
      required: [id, project_id, type, created_at]
      properties:
        id: {type: string, format: uuid}
        project_id: {type: string, format: uuid}
        parent_iteration_id: {type: string, format: uuid}
        type: {type: string, enum: [idea, sketch, generation, selection, composition, prompt, manual_edit]}
        title: {type: string, maxLength: 200}
        description: {type: string, maxLength: 5000}
        created_at: {type: string, format: date-time}
    IterationInput:
      type: object
      required: [type]
      additionalProperties: false
      properties:
        parent_iteration_id: {type: string, format: uuid}
        type: {type: string, enum: [idea, sketch, generation, selection, composition, prompt, manual_edit]}
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string, maxLength: 5000}
    IterationList:
      type: object
      required: [iterations]
      properties:
        iterations:
          type: array
          items: {$ref: '#/components/schemas/Iteration'}
    Project:
      type: object
