  /projects/{project_id}/recipes/{recipe_id}/duplicate:
    post:
      operationId: duplicateRecipe
      summary: Duplicate the current recipe version
      parameters:
        - {name: project_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: recipe_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '201': {description: Recipe, content: {application/json: {schema: {$ref: '#/components/schemas/Recipe'}}}}
  /projects/{project_id}/recipes/{recipe_id}/compatibility:
    post:
      operationId: checkRecipeCompatibility
      summary: Check recipe compatibility with the active ComfyUI provider
      parameters:
        - {name: project_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: recipe_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200':
          description: Compatibility result
          content:
            application/json:
              schema:
                type: object
                required: [compatible, issues, provider, model, version]
                properties:
                  compatible: {type: boolean}
                  issues: {type: array, items: {type: string}}
                  provider: {type: string}
                  model: {type: string}
                  version: {type: integer}
  /projects/{project_id}/recipes/from-generation/{generation_id}:
    post:
      operationId: saveGenerationAsRecipe
      summary: Save a successful generation's resolved workflow as a new recipe
      parameters:
        - {name: project_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: generation_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '201': {description: Recipe, content: {application/json: {schema: {$ref: '#/components/schemas/Recipe'}}}}
        '409': {$ref: '#/components/responses/Conflict'}

  /projects/{project_id}/lifecycle:
    get:
      operationId: getProjectLifecycle
      summary: Get archive/delete retention state
      parameters:
        - {name: project_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Lifecycle state}
    post:
      operationId: updateProjectLifecycle
      summary: Archive, soft-delete or restore a project
      parameters:
        - {name: project_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [archive, delete, restore]}
      responses:
        '200': {description: Updated lifecycle state}
  /projects/{project_id}/assets/{asset_id}/lifecycle:
    post:
      operationId: updateAssetLifecycle
      summary: Delete or restore an asset during retention
      parameters:
        - {name: project_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: asset_id, in: path, required: true, schema: {type: string, format: uuid}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: {type: string, enum: [delete, restore]}
      responses:
        '200': {description: Updated asset lifecycle}
  /projects/{project_id}/usage:
    get:
      operationId: getProjectUsage
      summary: Get daily, monthly and project generation usage
      parameters:
        - {name: project_id, in: path, required: true, schema: {type: string, format: uuid}}
      responses:
        '200': {description: Usage and quota}
  /projects/{project_id}/charges:
    post:
      operationId: chargeGeneration
      summary: Record generation cost exactly once
      parameters:
        - {name: project_id, in: path, required: true, schema: {type: string, format: uuid}}
        - {name: Idempotency-Key, in: header, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [generation_id, units, cost]
              properties:
                generation_id: {type: string, format: uuid}
                units: {type: integer, minimum: 1}
                cost: {type: number, minimum: 0}
      responses:
        '201': {description: Usage recorded}
        '200': {description: Idempotent replay}
        '429': {description: Quota exceeded}
  /search:
    get:
      operationId: searchCreativeContent
      summary: Search projects, prompts, iterations, assets, references, materials, textures and provenance
      parameters:
        - {name: q, in: query, required: true, schema: {type: string, minLength: 2}}
        - {name: type, in: query, required: false, schema: {type: string}}
        - {name: limit, in: query, required: false, schema: {type: integer, minimum: 1, maximum: 100, default: 25}}
      responses:
        '200': {description: Search results}

components:
  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Conflict
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Authentication required
      content:
        application/json:
          schema:
