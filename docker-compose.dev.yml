services:
  backend:
    build: {context: ./backend, dockerfile: Dockerfile}
    env_file: [.env]
    ports: ["${HOST_APP_PORT}:8080"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
  worker:
    build: {context: ./backend, dockerfile: Dockerfile.worker}
    env_file: [.env]
    extra_hosts: ["host.docker.internal:host-gateway"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
  frontend:
    image: node:22-alpine
    working_dir: /app
    env_file: [.env]
    environment: {CHOKIDAR_USEPOLLING: "true"}
    ports: ["${HOST_FRONTEND_PORT}:5173"]
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    depends_on: [backend]
  postgres:
    image: postgres:16-alpine
    env_file: [.env]
    ports: ["${HOST_POSTGRES_PORT}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [postgres_data:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ["${HOST_REDIS_PORT}:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: [redis_data:/data]
  minio:
    image: minio/minio:latest
    env_file: [.env]
    ports: ["${HOST_MINIO_API_PORT}:9000", "${HOST_MINIO_CONSOLE_PORT}:9001"]
    command: ["server", "/data", "--console-address", ":9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes: [minio_data:/data]
volumes:
  frontend_node_modules:
  postgres_data:
  redis_data:
  minio_data:
