name: debug-backend-vet

on:
  pull_request:

permissions:
  contents: read

jobs:
  vet:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.mod
      - name: Resolve dependencies
        run: go mod tidy
      - name: Capture vet output
        run: |
          set +e
          go vet ./... > ../vet-output.txt 2>&1
          rc=$?
          cat ../vet-output.txt
          exit 0
      - name: Upload vet output
        uses: actions/upload-artifact@v4
        with:
          name: backend-vet-output
          path: vet-output.txt
