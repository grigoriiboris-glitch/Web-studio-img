name: Pi Agent Bridge

on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  bridge:
    name: Local pi.dev bridge tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/pi-agent-bridge
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Syntax check
        run: |
          node --check server.mjs
          node --check policy-extension.mjs
      - name: Tests
        run: npm test
