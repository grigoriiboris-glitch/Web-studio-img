name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: webstudio
          POSTGRES_USER: webstudio
          POSTGRES_PASSWORD: webstudio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webstudio -d webstudio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.mod

      - name: Resolve dependencies
        run: go mod tidy

      - name: Format Go code
        run: gofmt -w .

      - name: Format check
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./...

      - name: Race tests
        run: go test -race ./...

      - name: Build
        run: go build ./...

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.4.0
          working-directory: backend
          args: --timeout=5m

  sqlc:
    name: SQLC validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: backend/go.mod
      - name: Install sqlc
        run: go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.29.0
      - name: Generate
        run: sqlc generate
      - name: Check generated files
        run: git diff --exit-code -- internal/db

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package.json
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Tests
        run: npm run test
      - name: Build
        run: npm run build

  migrations:
    name: Migration validation
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: webstudio
          POSTGRES_USER: webstudio
          POSTGRES_PASSWORD: webstudio
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U webstudio -d webstudio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - name: Install migrate
        run: |
          curl -fsSL https://github.com/golang-migrate/migrate/releases/download/v4.18.3/migrate.linux-amd64.tar.gz | tar -xz
          sudo mv migrate /usr/local/bin/migrate
      - name: Apply all migrations
        env:
          DB_URL: postgres://webstudio:webstudio@localhost:5432/webstudio?sslmode=disable
        run: migrate -path backend/migrations -database "$DB_URL" up
      - name: Verify schema
        env:
          DB_URL: postgres://webstudio:webstudio@localhost:5432/webstudio?sslmode=disable
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql "$DB_URL" -v ON_ERROR_STOP=1 -c "SELECT COUNT(*) = 5 AS expected_tables FROM information_schema.tables WHERE table_schema = 'public' AND table_name IN ('users','projects','iterations','generations','assets');"
      - name: Roll back latest migration
        env:
          DB_URL: postgres://webstudio:webstudio@localhost:5432/webstudio?sslmode=disable
        run: migrate -path backend/migrations -database "$DB_URL" down 1
      - name: Re-apply latest migration
        env:
          DB_URL: postgres://webstudio:webstudio@localhost:5432/webstudio?sslmode=disable
        run: migrate -path backend/migrations -database "$DB_URL" up

  docker:
    name: Docker builds
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile backend
      - name: Build frontend image
        run: docker build -f frontend/Dockerfile frontend
      - name: Validate Compose
        run: docker compose config
